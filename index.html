<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f1319">
<meta name="description" content="Guided review for your Apex Legends clips.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Clip Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone stepper, one viewing pass per screen, big tap targets. Same dark tactical look as the Field Manual and Ranked Debrief. */
:root{
  --bg:#0f1319; --panel:#171d26; --panel-2:#1d2530; --line:#28323f;
  --ink:#e9e5da; --muted:#8992a1; --faint:#6a7482;
  --amber:#e8a33d; --amber-ink:#12161d; --teal:#46b39a; --red:#d9634f; --blue:#5b8fc4; --violet:#b07cc9; --sand:#c9a37a; --rose:#c9708f; --olive:#9aa65a; --grey:#8992a1;
  --teal-bg:rgba(70,179,154,.16); --red-bg:rgba(217,99,79,.16); --amber-bg:rgba(232,163,61,.16);
  --teal-ink:#a9e4d4; --red-ink:#f0b6aa; --amber-ink2:#f0d09a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-block:18px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:.4px;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.chevron{width:32px;height:32px;flex:none;background:linear-gradient(150deg,var(--amber),#c07d1f);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.brand h1{font-size:26px;font-weight:700;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.timer{font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--amber-ink2);border-color:var(--amber);background:var(--amber-bg)}
.sync{font-size:12px;color:var(--faint);margin:8px 0 10px;min-height:18px}
.sync.ok{color:var(--teal)} .sync.warn{color:var(--amber)}
.err{background:var(--red-bg);border:1px solid var(--red);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.err p{margin:0 0 8px}
.err code{font-size:12px;overflow-wrap:anywhere;color:var(--red-ink)}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:4px 12px}
.tabs button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font-size:13px;color:var(--muted);min-height:44px}
.tabs button[aria-selected="true"]{background:var(--panel-2);border-color:var(--amber);color:var(--ink);font-weight:600}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:700;line-height:18px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;margin-bottom:14px}
.panel h2{font-size:21px;font-weight:600;margin-bottom:4px}
.panel h3{font-size:17px;font-weight:600;margin-bottom:8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.faint{color:var(--faint);font-size:12.5px}

.primary{width:100%;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.6px;color:var(--amber-ink);background:linear-gradient(150deg,var(--amber),#d1892a);border:0;padding:14px;border-radius:12px;min-height:50px}
.primary:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.ghost{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;min-height:44px}
.ghost.danger{border-color:var(--red);color:var(--red-ink)}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:8px 0;min-height:36px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}

/* steps */
.stepbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 6px}
.stepbar span{height:5px;border-radius:3px;background:var(--line)}
.stepbar span.done{background:var(--teal)} .stepbar span.on{background:var(--amber)}
.steplabel{font-size:12px;color:var(--faint);margin-bottom:10px;letter-spacing:.3px;text-transform:uppercase}
.how{border-left:3px solid var(--amber);padding:2px 0 2px 12px;margin:0 0 14px;font-size:14.5px}
.ask{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:0 0 14px}
.ask .t{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ask ul{margin:0;padding-left:18px;font-size:14px}
.ask li{margin:3px 0}
.field{margin-bottom:16px}
.field>.q{font-size:14px;font-weight:500;margin-bottom:8px}
.q .opt{color:var(--faint);font-weight:400;font-size:12.5px}
.q .note{display:block;color:var(--faint);font-weight:400;font-size:12.5px;margin-top:2px}
textarea.inp,input.inp{font:inherit;font-size:16px;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;resize:vertical}
textarea.inp{min-height:72px}
.inp::placeholder{color:var(--faint)}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font-size:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-ink2)}
.seg.small button{padding:8px 10px;font-size:13px;min-height:42px}

.group{margin-bottom:8px}
.group>h3{font-size:16px;color:var(--amber);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.8px}
.check{padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .t{font-size:14.5px}
.check .hint{font-size:12.5px;color:var(--faint);margin-top:2px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tri button{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 4px;font-size:13.5px;min-height:44px}
.tri button[data-v="y"][aria-pressed="true"]{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-ink)}
.tri button[data-v="n"][aria-pressed="true"]{background:var(--red-bg);border-color:var(--red);color:var(--red-ink)}
.tri button[data-v="?"][aria-pressed="true"]{background:var(--line);border-color:var(--faint)}

.habits{display:grid;grid-template-columns:1fr;gap:6px}
.habits button{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.habits button .n{font-family:var(--display);font-weight:700;color:var(--amber);font-size:17px;width:16px;flex:none}
.habits button .c{margin-left:auto;font-size:12px;color:var(--faint);flex:none;text-align:right;max-width:45%}
.habits button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-bg)}
.toggle{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14.5px;min-height:46px}
.toggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.toggle[aria-pressed="true"]{border-color:var(--teal)}
.toggle[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:var(--amber-ink)}
.nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:4px}

.steps-list{margin:0;padding:0;list-style:none;counter-reset:s}
.steps-list li{counter-increment:s;display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.steps-list li:last-child{border-bottom:0}
.steps-list li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--amber);font-size:18px;width:14px;flex:none;line-height:1.25}
.steps-list b{font-weight:600}

/* patterns */
.band{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.stat{background:var(--panel);padding:12px 14px;min-width:0}
.stat .k{color:var(--faint);font-size:11.5px}
.stat .v{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.focus{border-left:3px solid var(--amber);padding:2px 0 2px 12px}
.focus .label{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.focus .name{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.focus p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar .lbl{width:132px;flex:none;font-size:13px;color:var(--muted)}
.bar .track{flex:1;height:14px;background:var(--panel-2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{display:block;height:100%;border-radius:7px}
.bar .ct{width:22px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.miss{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.miss:last-child{border-bottom:0}
.miss .r{flex:none;font-variant-numeric:tabular-nums;color:var(--red-ink);font-size:13px}
.miss .h{display:block;font-size:12px;color:var(--faint)}

/* questions + log */
.qcard{border-bottom:1px solid var(--line);padding:12px 0}
.qcard:last-child{border-bottom:0}
.qcard .qt{font-size:15px;font-weight:500;margin-bottom:4px}
.meta{font-size:12px;color:var(--faint);margin-bottom:8px}
.qcard .row{margin-top:8px}
.ans{font-size:14px;color:var(--muted);margin:4px 0 0}
.logrow{border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logrow>button{width:100%;text-align:left;background:none;border:0;padding:11px 0;display:flex;gap:10px;align-items:center;min-height:48px}
.chip{flex:none;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.chip.win{border-color:var(--teal);color:var(--teal-ink)}
.chip.bad{border-color:var(--red);color:var(--red-ink)}
.logrow .s{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .d{flex:none;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.detail{padding:0 0 14px;font-size:14px}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.detail dt{color:var(--faint);font-size:12.5px}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.copybox{width:100%;margin-top:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:120px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--panel-2);border:1px solid var(--teal);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="chevron" aria-hidden="true"></div>
      <div><h1>Clip Review</h1><p>Study your Outplayed clips one pass at a time.</p></div>
    </div>
    <div id="timer" class="timer" hidden></div>
  </header>
  <div id="sync" class="sync"></div>
  <div id="err" class="err" hidden></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="review" id="tab-review">Review</button>
    <button role="tab" data-tab="patterns" id="tab-patterns">Patterns</button>
    <button role="tab" data-tab="questions" id="tab-questions">Questions</button>
    <button role="tab" data-tab="log" id="tab-log">Log</button>
  </nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
// ---------- what to work on: your 8 habits plus two clip-only focuses ----------
var FOCI = {
  "1":{name:"The pinch", note:"Cards 3.3"},
  "2":{name:"One small play, then back up", note:"Cards 3.5, 3.2"},
  "3":{name:"Crosshair at head level", note:"Cards 4.12, 4.14, 4.4, 4.5"},
  "4":{name:"Call the side", note:"Cards 0.3, 0.1"},
  "5":{name:"Rotate early, scan early", note:"Cards 1.1, 1.7, 1.8, 0.1b"},
  "6":{name:"Info peek before you swing", note:"Cards 4.8, 4.2, 4.16"},
  "7":{name:"Check behind while healing", note:"Cards 2.3, 5.1"},
  "8":{name:"Fight in sync", note:"Cards 5.4, 5.2"},
  "U":{name:"Use your kit and grenades", note:"Tactical or a nade before every push. Throw nades before you go down."},
  "D":{name:"Land with a plan", note:"Pick your gun spot and your exit before you jump."}
};
var FOCUS_ORDER = ["1","2","3","4","5","6","7","8","U","D"];

var TYPES = [["death","Death"],["lostfight","Lost fight"],["knock","Knock, no kill"],["win","Win / clean fight"]];
var MAPS = ["Broken Moon","World's Edge","Olympus","Storm Point","Kings Canyon","E-District","Other"];
var LEGENDS = ["Alter","Conduit","Catalyst","Mad Maggie","Valkyrie","Axle","Ash","Other"];
var KIT = {
  "Alter":"Void Passage open as an exit before you commit. Void Nexus to pull the team out.",
  "Conduit":"Radiant Transfer to shield a teammate mid-fight. Energy Barricade to stall a push.",
  "Catalyst":"Piercing Spikes to slow a push or hold a door. Dark Veil to block sight while you reset.",
  "Mad Maggie":"Riot Drill to flush someone off cover. Wrecking Ball to break a hold.",
  "Valkyrie":"Missile Swarm to stun before you swing. Skyward Dive to rotate or escape.",
  "Ash":"Arc Snare to lock a target. Phase Breach to engage or escape."
};
var SITUATIONS = [["hotdrop","Hot drop"],["looting","Looting"],["rotating","Rotating"],["holding","Holding a spot"],["endgame","Endgame (ring 4+)"],["short","Down a teammate"]];
var STARTERS = [["us","We did"],["them","They did"],["third","A third team"],["none","No fight"]];
var PLANS = [["fight","Take a fight"],["rotate","Rotate"],["loot","Loot"],["reset","Heal and reset"],["thirdparty","Third-party someone"],["hold","Hold a spot"],["noplan","No real plan"]];
var WHEN = [["lt5","Under 5s before"],["5to30","5–30s before"],["30to60","30–60s before"],["ring","A ring earlier"]];
var KINDS = [["decision","Decision"],["execution","Execution"],["both","Both"],["neither","Neither"]];

var GROUPS = {
  drop:{title:"The drop", checks:[
    {k:"dropplan", t:"I landed with a plan: where my gun is and where we exit", f:"D"},
    {k:"dropnear", t:"I landed close enough to help my teammates", f:"D"},
    {k:"dropgun", t:"I had a gun before I took a fight", f:"D"},
    {k:"dropleave", t:"We left when the drop went bad, instead of staying to die", f:"D"}
  ]},
  position:{title:"Position and rotation", checks:[
    {k:"early", t:"We moved before the ring forced us", f:"5"},
    {k:"cover", t:"Our path had cover", f:"5"},
    {k:"side", t:"We knew if we were on the strong or weak side", f:"4"},
    {k:"height", t:"I kept height, and didn't drop off it just because a teammate did", f:"4", hint:"Follow the plan, not the person. Dropping off height gives away your advantage."},
    {k:"count", t:"I knew how many enemies we were fighting", f:"6"},
    {k:"ready", t:"I was healed, shielded and reloaded before it started", f:"2"},
    {k:"behind", t:"Someone checked behind us for a third party", f:"7"},
    {k:"split", t:"I took a different angle than my teammate (no stacking)", f:"1"}
  ]},
  comms:{title:"Comms", checks:[
    {k:"saw", t:"I called what I saw: where, how many, how hurt", f:"8"},
    {k:"doing", t:"I said what I was doing before I did it", f:"8", hint:"\"Swinging left.\" \"Healing.\" \"Resetting to the rock.\""},
    {k:"ping", t:"I pinged enemies instead of only saying them", f:"8"},
    {k:"knew", t:"My teammates knew where I was", f:"8"},
    {k:"calls", t:"Calls were made, and we acted on them", f:"8"},
    {k:"plancall", t:"Someone called the plan before we moved", f:"8"}
  ]},
  fight:{title:"Gunfight", checks:[
    {k:"head", t:"My crosshair stayed at head height", f:"3"},
    {k:"preaim", t:"I pre-aimed where they came out", f:"3"},
    {k:"peek", t:"I info-peeked before I swung", f:"6"},
    {k:"coverpeek", t:"I shot from cover and didn't stand in the open", f:"6"},
    {k:"small", t:"I made one small play, then backed up", f:"2"},
    {k:"bigdmg", t:"I only pushed hard off big damage or a knock", f:"2"},
    {k:"reload", t:"I reloaded and healed behind cover", f:"7"},
    {k:"sync", t:"We pushed together off a teammate's knock", f:"8"}
  ]},
  kit:{title:"Kit and grenades", checks:[
    {k:"tac", t:"I used my tactical in this fight", f:"U", legendHint:true},
    {k:"ult", t:"I used my ultimate, or had a reason to save it", f:"U", legendHint:true},
    {k:"nades", t:"I threw my grenades before I went down", f:"U", hint:"Tap N/A if you had none."},
    {k:"utilfirst", t:"I used utility before pushing, not after", f:"U"}
  ]}
};
var GROUP_ORDER = ["drop","position","comms","fight","kit"];
var ALLCHECKS = []; GROUP_ORDER.forEach(function(g){ GROUPS[g].checks.forEach(function(c){ c.group=GROUPS[g].title; ALLCHECKS.push(c); }); });

var CAUSES = [
  {k:"ring", label:"Caught by ring", f:"5", color:"var(--blue)"},
  {k:"thirdparty", label:"Third party", f:"7", color:"var(--amber)"},
  {k:"push", label:"Bad push", f:"2", color:"var(--red)"},
  {k:"gunfight", label:"Lost gunfight", f:"3", color:"var(--violet)"},
  {k:"comms", label:"Team out of sync", f:"8", color:"var(--teal)"},
  {k:"spacing", label:"Stacked / gave up height", f:"1", color:"var(--sand)"},
  {k:"util", label:"Didn't use my kit", f:"U", color:"var(--rose)"},
  {k:"drop", label:"Lost the hot drop", f:"D", color:"var(--olive)"},
  {k:"other", label:"Something else", f:null, color:"var(--grey)"},
  {k:"win", label:"Clean play to repeat", f:null, color:"var(--teal)"}
];
var STEPS = ["Clip","Gut pass","Rewind","Before the fight","Comms","The fight","Verdict"];
var LAST = STEPS.length-1;
var LOCAL_KEY="apex_clip_review_v1", DRAFT_KEY="apex_clip_draft", SESSION_KEY="apex_clip_session", BACKUP_KEY="apex_clip_last_backup";

function lget(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lset(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function blankDraft(){ return {type:null,map:"",legend:"",label:"",situation:[],starter:null,plan:null,gut:"",when:null,lastGood:"",checks:{},cause:null,kind:null,habit:null,fix:"",rehearsed:false,question:""}; }
function normDraft(d){ var b=blankDraft(); d=d||{}; for(var k in b) if(d[k]===undefined) d[k]=b[k]; if(!Array.isArray(d.situation)) d.situation=[]; if(!d.checks||typeof d.checks!=="object") d.checks={}; return d; }

var S = { clips:[], sig:"", mode:"local", db:null, tab:"review", step:-1, draft:normDraft(lget(DRAFT_KEY)), open:{}, delArm:null, ans:{}, sessionStart:lget(SESSION_KEY) };
if(typeof S.draft._step==="number" && S.draft._step>=0) S.step=Math.min(S.draft._step,LAST);
(function(){ var o=lget(LOCAL_KEY); if(o&&o.clips) S.clips=o.clips; })();

// ---------- errors: show them instead of failing silently ----------
function showErr(msg){
  var el=document.getElementById("err"); if(!el) return; clear(el);
  el.appendChild(h("p",null,"Something on this page broke. Tap Reset screen to keep going; your answers are saved. If it keeps happening, screenshot this box for Claude."));
  el.appendChild(h("p",null,h("code",{text:String(msg||"Unknown error").slice(0,300)})));
  el.appendChild(h("button",{type:"button",class:"ghost",onclick:function(){ el.hidden=true; safeRender(); }},"Reset screen"));
  el.hidden=false;
}

  v.appendChild(cp);

  var mp=h("section",{class:"panel"}, h("h3",{text:"Checks you miss most"}));
  var rows=ALLCHECKS.map(function(ch){ var y=0,nn=0; clips.forEach(function(c){ var a=c.checks&&c.checks[ch.k]; if(a==="y") y++; if(a==="n") nn++; }); return {ch:ch,y:y,n:nn}; })
    .filter(function(r){ return r.n>0; }).sort(function(a,b){ return (b.n/(b.n+b.y))-(a.n/(a.n+a.y)) || b.n-a.n; }).slice(0,8);
  if(!rows.length) mp.appendChild(h("p",{class:"empty",text:"No misses marked yet. Answer the yes or no checks in steps 4 to 6."}));
  rows.forEach(function(r){ mp.appendChild(h("div",{class:"miss"}, h("span",null, r.ch.t, h("span",{class:"h",text:r.ch.group+" · "+focusName(r.ch.f)})), h("span",{class:"r",text:"missed "+r.n+" of "+(r.n+r.y)}))); });
  v.appendChild(mp);

  var pp=h("section",{class:"panel"}, h("h3",{text:"Your plan going in"}), h("p",{class:"sub",text:"A lot of \"No real plan\" means fights are choosing you."}));
  var pc={}, anyP=false; clips.forEach(function(c){ if(c.plan){ pc[c.plan]=(pc[c.plan]||0)+1; anyP=true; } });
  if(!anyP) pp.appendChild(h("p",{class:"empty",text:"Not marked yet. The gut pass asks this."}));
  else bars(pp, PLANS.filter(function(p){ return pc[p[0]]; }).map(function(p){ return {label:p[1], n:pc[p[0]], color:p[0]==="noplan"?"var(--red)":"var(--amber)"}; }));
  v.appendChild(pp);

  var wp=h("section",{class:"panel"}, h("h3",{text:"When your options disappear"}), h("p",{class:"sub",text:"Earlier means the mistake is a decision or rotation, not aim."}));
  var wc={}, anyW=false; leaks.forEach(function(c){ if(c.when){ wc[c.when]=(wc[c.when]||0)+1; anyW=true; } });
  if(!anyW) wp.appendChild(h("p",{class:"empty",text:"Not marked yet. The rewind step asks this."}));
  else bars(wp, WHEN.map(function(w){ return {label:w[1], n:wc[w[0]]||0}; }));
  v.appendChild(wp);
}

// ---------- questions ----------
function metaLine(c){ return [fmtDate(c.date), label(TYPES,c.type), c.map, c.label].filter(Boolean).join(" · "); }
function renderQuestions(v){
  var open=newestFirst().filter(function(c){ return c.question && !c.qDone; });
  var done=newestFirst().filter(function(c){ return c.question && c.qDone; });
  var p=h("section",{class:"panel"}, h("h2",{text:"Open questions"}),
    h("p",{class:"sub",text:"Things you weren't sure about while reviewing. Test them in the firing range, ask a teammate, or bring them to Claude. Write the answer here once you have it."}));
  if(!open.length) p.appendChild(h("p",{class:"empty",text:"No open questions. The last step of a review has a spot for one."}));
  open.forEach(function(c){
    var ta=h("textarea",{class:"inp",id:"ans-"+c.id,rows:"2",placeholder:"What you found out"}); ta.value=(S.ans[c.id]!=null?S.ans[c.id]:(c.answer||""));
    ta.addEventListener("input",function(){ S.ans[c.id]=ta.value; });
    function save(markDone){
      var nc={}; for(var k in c) nc[k]=c[k]; nc.answer=ta.value.trim(); if(markDone) nc.qDone=true;
      putClip(nc).then(function(){ delete S.ans[c.id]; safeRender(); toast(markDone?"Marked answered.":"Answer saved."); }).catch(function(){ toast("Couldn't save. Try again."); });
    }
    p.appendChild(h("div",{class:"qcard"}, h("div",{class:"qt",text:c.question}), h("div",{class:"meta",text:metaLine(c)}), ta,
      h("div",{class:"row"}, h("button",{type:"button",class:"ghost",onclick:function(){ save(false); }},"Save answer"), h("button",{type:"button",class:"ghost",onclick:function(){ save(true); }},"Mark answered"))));
  });
  v.appendChild(p);
  if(done.length){
    var dp=h("section",{class:"panel"}, h("h3",{text:"Answered ("+done.length+")"}));
    done.forEach(function(c){ dp.appendChild(h("div",{class:"qcard"}, h("div",{class:"qt",text:c.question}), h("div",{class:"meta",text:metaLine(c)}), h("p",{class:"ans",text:c.answer||"No answer written."}))); });
    v.appendChild(dp);
  }
}

// ---------- log ----------
function missedList(c){ return ALLCHECKS.filter(function(ch){ return c.checks&&c.checks[ch.k]==="n"; }).map(function(ch){ return ch.t; }); }
function toTSV(){
  var cols=["Date","Clip type","Map","Legend","Clip name","Situation","Who started","Plan","What happened","Options gone / advantage","Safe choice / setup","Main cause","Decision or execution","Fix focus","Fix","Rehearsed","Missed checks","Question","Answer"];
  function clean(s){ return String(s==null?"":s).replace(/[\t\r\n]+/g," "); }
  var lines=[cols.join("\t")];
  newestFirst().forEach(function(c){ var ca=causeOf(c.cause);
    lines.push([c.date,label(TYPES,c.type),c.map,c.legend,c.label,labels(SITUATIONS,c.situation),label(STARTERS,c.starter),label(PLANS,c.plan),c.gut,label(WHEN,c.when),c.lastGood,ca?ca.label:"",label(KINDS,c.kind),focusName(c.habit),c.fix,c.rehearsed?"Yes":"No",missedList(c).join("; "),c.question,c.answer].map(clean).join("\t")); });
  return lines.join("\n");
}
function renderLog(v){
  var p=h("section",{class:"panel"}, h("h2",{text:"Review log"}));
  var list=newestFirst();
  if(!list.length){ p.appendChild(h("p",{class:"empty",text:"Your saved reviews will be listed here, newest first. Tap one to see everything you wrote."})); v.appendChild(p); return; }
  var copyWrap=h("div");
  p.appendChild(h("p",{class:"sub",text:list.length+" review"+(list.length===1?"":"s")+". Copy as a table to paste into a spreadsheet."}));
  p.appendChild(h("button",{type:"button",class:"ghost",onclick:function(){
    var t=toTSV();
    function fallback(){ clear(copyWrap); var ta=h("textarea",{class:"inp copybox",readonly:true,"aria-label":"Table to copy"}); ta.value=t; copyWrap.appendChild(h("p",{class:"faint",style:"margin:10px 0 0",text:"Copying is blocked here. Select all of this and copy it."})); copyWrap.appendChild(ta); ta.focus(); ta.select(); }
    try{ navigator.clipboard.writeText(t).then(function(){ toast("Copied. Paste into Google Sheets or Excel."); }, fallback); }catch(e){ fallback(); }
  }},"Copy as table"));
  p.appendChild(copyWrap);
  var box=h("div",{style:"margin-top:8px"});
  list.forEach(function(c){
    var ca=causeOf(c.cause), isOpen=!!S.open[c.id];
    var row=h("div",{class:"logrow"}, h("button",{type:"button","aria-expanded":String(isOpen),onclick:function(){ S.open[c.id]=!isOpen; rerender(); }},
      h("span",{class:"chip "+(c.type==="win"?"win":"bad"),text:label(TYPES,c.type)||"Clip"}), h("span",{class:"s",text:c.gut||c.fix||(ca?ca.label:"Review")}), h("span",{class:"d",text:fmtDate(c.date)})));
    if(isOpen){
      var dl=h("dl");
      function add(k,val){ if(val){ dl.appendChild(h("dt",{text:k})); dl.appendChild(h("dd",{text:val})); } }
      add("Clip", [c.map,c.legend,c.label].filter(Boolean).join(" · "));
      add("Situation", labels(SITUATIONS,c.situation));
      add("Who started", label(STARTERS,c.starter));
      add("Plan", label(PLANS,c.plan));
      add(c.type==="win"?"What went right":"What went wrong", c.gut);
      add(c.type==="win"?"Took the advantage":"Options gone", label(WHEN,c.when));
      add(c.type==="win"?"Setup":"Safe choice", c.lastGood);
      add("Main cause", ca?ca.label:"");
      add("Decision or execution", label(KINDS,c.kind));
      add("Fix focus", focusName(c.habit));
      add("Fix", c.fix);
      add("Rehearsed", c.rehearsed?"Yes":"");
      add("Missed", missedList(c).join("; "));
      add("Question", c.question); add("Answer", c.answer);
      var armed=S.delArm===c.id;
      row.appendChild(h("div",{class:"detail"}, dl, h("div",{class:"row",style:"margin-top:12px"},
        h("button",{type:"button",class:"ghost"+(armed?" danger":""),onclick:function(){
          if(!armed){ S.delArm=c.id; rerender(); setTimeout(function(){ if(S.delArm===c.id){ S.delArm=null; rerender(); } },4000); return; }
          S.delArm=null; removeClip(c.id).then(function(){ safeRender(); toast("Review deleted."); }).catch(function(){ toast("Couldn't delete. Try again."); });
        }}, armed?"Tap again to delete":"Delete review"))));
    }
    box.appendChild(row);
  });
  p.appendChild(box);
  v.appendChild(p);
}


// ---------- backup ----------
function fmtAgo(ts){ var d=Math.floor((Date.now()-ts)/864e5); return d<=0?"today":d===1?"yesterday":d+" days ago"; }
function saveBackup(){
  var data=JSON.stringify({app:"clip-review",version:1,exported:new Date().toISOString(),clips:S.clips,draft:S.draft},null,1);
  var url=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  var a=h("a",{href:url,download:"clip-review-backup-"+today()+".json"}); document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
  lset(BACKUP_KEY,Date.now()); safeRender(); toast("Backup saved to your Downloads.");
}
function restoreFrom(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result), list=Array.isArray(o)?o:(o&&o.clips)||[], added=0;
      if(!Array.isArray(list)) throw new Error("bad");
      list.forEach(function(c){ if(c&&c.id&&!S.clips.some(function(x){ return x.id===c.id; })){ S.clips.push(c); added++; } });
      var gotDraft=false;
      if(o&&o.draft&&o.draft.type&&!S.draft.type){ S.draft=normDraft(o.draft); S.step=(typeof o.draft._step==="number"&&o.draft._step>=0)?Math.min(o.draft._step,LAST):-1; lset(DRAFT_KEY,S.draft); gotDraft=true; }
      saveLocal(); safeRender();
      toast(added||gotDraft ? "Restored "+added+" review"+(added===1?"":"s")+(gotDraft?" and your unfinished one":"")+"." : "Nothing new in that file.");
    }catch(e){ toast("That file isn't a Clip Review backup."); }
  };
  r.readAsText(file);
}
function renderBackup(v){
  var last=lget(BACKUP_KEY);
  var inp=h("input",{type:"file",accept:".json,application/json",id:"restorefile",hidden:true});
  inp.addEventListener("change",function(){ var f=inp.files&&inp.files[0]; if(f) restoreFrom(f); inp.value=""; });
  v.appendChild(h("section",{class:"panel"}, h("h2",{text:"Backup"}),
    h("p",{class:"sub",text:(last?"Last backup "+fmtAgo(last)+". ":"No backup yet. ")+"Your reviews live only on this phone. Save a backup file every week or two, and keep it somewhere safe like Google Drive."}),
    h("div",{class:"row"}, h("button",{type:"button",class:"ghost",onclick:saveBackup},"Save backup file"), h("button",{type:"button",class:"ghost",onclick:function(){ inp.click(); }},"Restore from file")), inp));
}

// ---------- render ----------
function renderTabs(){
  var tabs=document.querySelectorAll(".tabs button");
  var openQ=S.clips.filter(function(c){ return c.question && !c.qDone; }).length;
  for(var i=0;i<tabs.length;i++){ var b=tabs[i], t=b.getAttribute("data-tab"); b.setAttribute("aria-selected",String(S.tab===t));
    if(t==="questions"){ clear(b); b.appendChild(document.createTextNode("Questions")); if(openQ) b.appendChild(h("span",{class:"badge",text:String(openQ)})); } }
}
// render(true) = new data arrived in the background. It never rebuilds a review in progress or a screen where you're typing.
function render(fromData){
  renderTabs();
  if(fromData===true && ((S.tab==="review" && S.step>=0) || typing())){ tickTimer(); return; }
  var v=document.getElementById("view"); clear(v);
  if(S.tab==="review") renderReview(v);
  else if(S.tab==="patterns") renderPatterns(v);
  else if(S.tab==="questions") renderQuestions(v);
  else { renderLog(v); renderBackup(v); }
  tickTimer();
}
function safeRender(fromData){ try{ render(fromData); }catch(e){ showErr(e&&e.message||e); } }
document.querySelector(".tabs").addEventListener("click",function(e){ var b=e.target.closest("button[data-tab]"); if(!b) return; S.tab=b.getAttribute("data-tab"); safeRender(); window.scrollTo(0,0); });

// ---------- boot ----------
safeRender();
setSync("Saved on this phone. Works offline.","ok");
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); }); }
})();
</script>

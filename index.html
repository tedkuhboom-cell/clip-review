<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1319">
<meta name="description" content="Study, play with one focus, log it, review your clips. A learning loop for competitive games.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Clip Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first app. Header, one scrolling view, fixed bottom nav for the four tools. Dark tactical look. */
:root{
  --bg:#0f1319; --panel:#171d26; --panel-2:#1d2530; --line:#28323f;
  --ink:#e9e5da; --muted:#8992a1; --faint:#6a7482;
  --amber:#e8a33d; --amber-ink:#12161d; --teal:#46b39a; --red:#d9634f; --blue:#5b8fc4; --violet:#b07cc9; --sand:#c9a37a; --rose:#c9708f; --olive:#9aa65a; --grey:#8992a1;
  --teal-bg:rgba(70,179,154,.16); --red-bg:rgba(217,99,79,.16); --amber-bg:rgba(232,163,61,.16); --violet-bg:rgba(176,124,201,.16);
  --teal-ink:#a9e4d4; --red-ink:#f0b6aa; --amber-ink2:#f0d09a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
html{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:calc(var(--navh) + 32px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);letter-spacing:.4px;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.chevron{width:30px;height:30px;flex:none;background:linear-gradient(150deg,var(--amber),#c07d1f);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.brand h1{font-size:25px;font-weight:700;line-height:1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.iconbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
.err{background:var(--red-bg);border:1px solid var(--red);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.err p{margin:0 0 8px}
.err code{font-size:12px;overflow-wrap:anywhere;color:var(--red-ink)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.bottom button{background:none;border:0;height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11.5px;position:relative}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
nav.bottom button[aria-selected="true"]{color:var(--amber)}
nav.bottom .dot{position:absolute;top:9px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:10.5px;font-weight:700;line-height:17px}

.subtabs{display:grid;gap:4px;margin-bottom:12px}
.subtabs button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:13px;color:var(--muted);min-height:42px}
.subtabs button[aria-selected="true"]{background:var(--panel-2);border-color:var(--amber);color:var(--ink);font-weight:600}
.subtabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--amber);color:var(--amber-ink);font-size:11px;font-weight:700;line-height:18px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0;margin-bottom:14px}
.panel h2{font-size:21px;font-weight:600;margin-bottom:4px}
.panel h3{font-size:17px;font-weight:600;margin-bottom:8px}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.faint{color:var(--faint);font-size:12.5px}
.primary{width:100%;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.6px;color:var(--amber-ink);background:linear-gradient(150deg,var(--amber),#d1892a);border:0;padding:14px;border-radius:12px;min-height:50px}
.primary:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
.ghost{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;min-height:44px}
.ghost.danger{border-color:var(--red);color:var(--red-ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
select.inp{font:inherit;font-size:16px;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px}
textarea.inp,input.inp{font:inherit;font-size:16px;width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:11px 12px;resize:vertical}
textarea.inp{min-height:72px}
.inp::placeholder{color:var(--faint)}
.field{margin-bottom:16px}
.field>.q{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.q .opt{color:var(--faint);font-weight:400;font-size:12.5px}
.q .note{display:block;color:var(--faint);font-weight:400;font-size:12.5px;margin-top:2px}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{font-size:14px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--amber-ink2)}
.seg.small button{padding:8px 10px;font-size:13px;min-height:42px}
.seg.exec button[data-k="nailed"][aria-pressed="true"]{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-ink)}
.seg.exec button[data-k="forgot"][aria-pressed="true"]{background:var(--red-bg);border-color:var(--red);color:var(--red-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.band{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.stat{background:var(--panel);padding:12px 14px;min-width:0}
.stat .k{color:var(--faint);font-size:11.5px}
.stat .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--faint);font-weight:500;margin-left:3px}
.v.pos{color:var(--teal)} .v.neg{color:var(--red)}
.focus{border-left:3px solid var(--amber);padding:2px 0 2px 12px}
.focus .label{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.focus .name{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.2}
.focus p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar .lbl{width:132px;flex:none;font-size:13px;color:var(--muted)}
.bar .track{flex:1;height:14px;background:var(--panel-2);border-radius:7px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{display:block;height:100%;border-radius:7px}
.bar .ct{width:22px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.linkbtn{background:none;border:0;color:var(--amber);padding:6px 0;font-size:13.5px;text-decoration:underline;min-height:36px;text-align:left}

/* manual */
.ladder .barline{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:4px 0 8px}
.ladder .key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.ladder .key i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--faint);margin-bottom:10px}
.prog .track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog .track span{display:block;height:100%;background:var(--amber)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.tag.new{border-color:var(--violet);color:#d9bbe8} .tag.due{border-color:var(--amber);color:var(--amber-ink2)}
.cardq{font-family:var(--display);font-size:24px;font-weight:600;line-height:1.25;margin:4px 0 8px}
.say{color:var(--faint);font-size:13px;margin:0 0 16px}
.cardtitle{font-size:21px;margin:6px 0 8px}
.concept{font-size:15px;margin:0 0 12px}
.drill{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 16px}
.grades{display:grid;gap:8px}
.grade{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;min-height:52px;text-align:left}
.grade small{color:var(--faint);font-size:12px}
.grade.miss{border-color:var(--red)} .grade.shaky{border-color:var(--amber)} .grade.got{border-color:var(--teal)}
.lcard{border-bottom:1px solid var(--line);padding:12px 0}
.lcard:last-child{border-bottom:0}
.lcard .ct{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lcard h3{font-size:17px;margin:0}
.lcard .id{color:var(--amber);margin-right:7px}
.status{flex:none;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.s-own{border-color:var(--teal);color:var(--teal-ink)} .s-solid{border-color:var(--violet);color:#d9bbe8} .s-learn{border-color:var(--amber);color:var(--amber-ink2)}
.lcard p{margin:6px 0 0;font-size:14px}
.lcard .kv{font-size:13.5px;color:var(--muted);margin-top:6px}
.lcard .kv b{color:var(--ink);font-weight:600}
.modhead{font-family:var(--display);font-size:15px;color:var(--amber);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 2px}
details.more summary{cursor:pointer;color:var(--muted);font-size:14px;padding:8px 0;min-height:40px}
details.more p{font-size:14px;margin:6px 0}
.rrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.rrow b{flex:none;width:92px}

/* typed recall */
.answerbox{min-height:110px}
.recallhint{color:var(--faint);font-size:12.5px;margin:6px 0 14px}
.verdictbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-radius:12px;padding:12px 14px;margin-bottom:12px;border:1px solid var(--line)}
.verdictbar b{font-family:var(--display);font-size:24px;letter-spacing:.5px}
.verdictbar.got{background:var(--teal-bg);border-color:var(--teal)} .verdictbar.got b{color:var(--teal-ink)}
.verdictbar.shaky{background:var(--amber-bg);border-color:var(--amber)} .verdictbar.shaky b{color:var(--amber-ink2)}
.verdictbar.miss{background:var(--red-bg);border-color:var(--red)} .verdictbar.miss b{color:var(--red-ink)}
.youranswer{background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted);margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.kplist{list-style:none;margin:0 0 14px;padding:0}
.kplist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px;opacity:0;animation:kpin .35s ease forwards}
.kplist li:last-child{border-bottom:0}
.kplist .mk{flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px}
.kplist .hit .mk{background:var(--teal);color:var(--amber-ink)}
.kplist .no .mk{background:var(--red-bg);color:var(--red-ink);border:1px solid var(--red)}
.kplist .no span{color:var(--muted)}
@keyframes kpin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.kplist li{animation:none;opacity:1}}
.appeal{background:none;border:0;color:var(--faint);text-decoration:underline;font-size:12.5px;padding:10px 0 0;min-height:36px}

.kplist .deep .mk{background:none;border:1px dashed var(--faint);color:var(--faint)}
.kplist .deep.hit .mk{background:var(--violet-bg);border:1px solid var(--violet);color:#d9bbe8}
.kplist .deep span{color:var(--muted)}
.kphead{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin:2px 0 2px}
.fullstar{font-size:12px;color:#d9bbe8;border:1px solid var(--violet);border-radius:999px;padding:2px 9px;margin-left:8px;font-family:var(--body);letter-spacing:0;vertical-align:middle}

/* live session */
.live{border-color:var(--amber)}
.livehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.livetag{font-size:11.5px;color:var(--amber-ink2);text-transform:uppercase;letter-spacing:.8px}
.livetag::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.gamebox{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.gamebox h3{font-size:18px;margin-bottom:8px}
.gdots{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.gdot{width:18px;height:18px;border-radius:5px;font-size:10px;display:grid;place-items:center;color:var(--amber-ink);font-weight:700}
.gdot.nailed{background:var(--teal)} .gdot.some{background:var(--amber)} .gdot.forgot{background:var(--red)}
.tilt{background:var(--red-bg);border:1px solid var(--red);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0}
.seg.exec button[data-k="nailed"][aria-pressed="true"]{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-ink)}

/* proof */
.proofcard{background:linear-gradient(160deg,#1d2530,#141a22);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
.proofcard .ph{font-family:var(--display);font-size:13px;letter-spacing:1.5px;color:var(--amber);text-transform:uppercase}
.proofcard .pt{font-family:var(--display);font-size:28px;font-weight:700;margin:2px 0 12px}
.pblocks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pblock{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.pblock .big{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05;color:var(--teal-ink);font-variant-numeric:tabular-nums}
.pblock .lab{font-size:12.5px;color:var(--muted);margin-top:4px}
.pfoot{font-size:12px;color:var(--faint);margin-top:12px}
.trend{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.trend:last-child{border-bottom:0}
.trend .r{flex:none;font-variant-numeric:tabular-nums;font-size:13px}
.trend .up{color:var(--teal-ink)} .trend .down{color:var(--red-ink)}

/* debrief */
.dots{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.edot{width:15px;height:15px;border-radius:4px;flex:none}
.edot.nailed{background:var(--teal)} .edot.some{background:var(--amber)} .edot.forgot{background:var(--red)}
.verdict{font-size:13.5px;color:var(--muted);margin:10px 0 0}
.verdict b{color:var(--ink)}
.frow{padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .ft{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.hitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hitem:last-child{border-bottom:0}
.hbadge{width:10px;height:10px;border-radius:50%;flex:none}
.hmeta{flex:1;min-width:0;font-size:13.5px}
.hmeta .l2{display:block;color:var(--faint);font-size:12px}
.rp{flex:none;font-variant-numeric:tabular-nums;font-size:13.5px;color:var(--muted)}
.rp.pos{color:var(--teal)} .rp.neg{color:var(--red)}
.del{background:none;border:1px solid var(--line);border-radius:8px;color:var(--faint);font-size:12px;padding:6px 9px;min-height:36px}
.del[data-armed]{border-color:var(--red);color:var(--red-ink)}
svg.spark{width:100%;height:60px;display:block}

/* clips */
.stepbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 6px}
.stepbar span{height:5px;border-radius:3px;background:var(--line)}
.stepbar span.done{background:var(--teal)} .stepbar span.on{background:var(--amber)}
.steplabel{font-size:12px;color:var(--faint);margin-bottom:10px;letter-spacing:.3px;text-transform:uppercase}
.how{border-left:3px solid var(--amber);padding:2px 0 2px 12px;margin:0 0 14px;font-size:14.5px}
.ask{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:0 0 14px}
.ask .t{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.ask ul{margin:0;padding-left:18px;font-size:14px}
.ask li{margin:3px 0}
.timer{display:inline-block;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.timer.warn{color:var(--amber-ink2);border-color:var(--amber);background:var(--amber-bg)}
.group{margin-bottom:8px}
.group>h3{font-size:16px;color:var(--amber);margin:6px 0 2px;text-transform:uppercase;letter-spacing:.8px}
.check{padding:11px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .t{font-size:14.5px}
.check .hint2{font-size:12.5px;color:var(--faint);margin-top:2px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tri button{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:8px 4px;font-size:13.5px;min-height:44px}
.tri button[data-k="y"][aria-pressed="true"]{background:var(--teal-bg);border-color:var(--teal);color:var(--teal-ink)}
.tri button[data-k="n"][aria-pressed="true"]{background:var(--red-bg);border-color:var(--red);color:var(--red-ink)}
.tri button[data-k="?"][aria-pressed="true"]{background:var(--line);border-color:var(--faint)}
.habits{display:grid;grid-template-columns:1fr;gap:6px}
.habits button{display:flex;gap:10px;align-items:baseline;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.habits button .n{font-family:var(--display);font-weight:700;color:var(--amber);font-size:17px;width:16px;flex:none}
.habits button .c{margin-left:auto;font-size:12px;color:var(--faint);flex:none;text-align:right;max-width:45%}
.habits button[aria-pressed="true"]{border-color:var(--amber);background:var(--amber-bg)}
.toggle{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14.5px;min-height:46px}
.toggle .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--faint);flex:none;display:grid;place-items:center;font-size:14px;font-weight:700}
.toggle[aria-pressed="true"]{border-color:var(--teal)}
.toggle[aria-pressed="true"] .box{background:var(--teal);border-color:var(--teal);color:var(--amber-ink)}
.nav2{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:4px}
.steps-list{margin:0;padding:0;list-style:none;counter-reset:s}
.steps-list li{counter-increment:s;display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.steps-list li:last-child{border-bottom:0}
.steps-list li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--amber);font-size:18px;width:14px;flex:none;line-height:1.25}
.miss{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.miss:last-child{border-bottom:0}
.miss .r{flex:none;font-variant-numeric:tabular-nums;color:var(--red-ink);font-size:13px}
.miss .h{display:block;font-size:12px;color:var(--faint)}
.qcard{border-bottom:1px solid var(--line);padding:12px 0}
.qcard:last-child{border-bottom:0}
.qcard .qt{font-size:15px;font-weight:500;margin-bottom:4px}
.meta{font-size:12px;color:var(--faint);margin-bottom:8px}
.qcard .row{margin-top:8px}
.ans{font-size:14px;color:var(--muted);margin:4px 0 0}
.logrow{border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logrow>button{width:100%;text-align:left;background:none;border:0;padding:11px 0;display:flex;gap:10px;align-items:center;min-height:48px}
.chip{flex:none;font-size:11.5px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted)}
.chip.win{border-color:var(--teal);color:var(--teal-ink)}
.chip.bad{border-color:var(--red);color:var(--red-ink)}
.logrow .s{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logrow .d{flex:none;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.detail{padding:0 0 14px;font-size:14px}
.detail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px}
.detail dt{color:var(--faint);font-size:12.5px}
.detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
.copybox{width:100%;margin-top:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:120px}

/* maps */
.mapchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mapchips button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13.5px;min-height:42px;color:var(--muted)}
.mapchips button[aria-pressed="true"]{border-color:var(--amber);color:var(--ink);background:var(--panel-2)}
.mapchips .rk{color:var(--teal);margin-left:5px;font-size:11px}
.mrow{padding:11px 0;border-top:1px solid var(--line)}
.mrow .k{font-size:11.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px}
.mrow .v{font-size:14.5px}
.mrow.meta .k{color:var(--teal)} .mrow.meta .v{color:#bfe6db}
.mrow.warn .k{color:var(--red)} .mrow.warn .v{color:#e2b3a8}
.mrow.focus2 .k{color:var(--amber)} .mrow.focus2 .v{color:#e7cfa2}
.sig{color:var(--muted);font-style:italic;font-size:14px;margin:4px 0 6px}
.mains-hl{color:var(--amber-ink2)}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--panel-2);border:1px solid var(--teal);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

    </div>

  <main id="view"></main>
</div>
<nav class="bottom" id="nav" aria-label="Tools">
  <div class="in">
    <button type="button" data-tab="manual" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M8 7h7"/></svg><span>Manual</span></button>
    <button type="button" data-tab="debrief" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 19V9"/><path d="M10 19V5"/><path d="M16 19v-7"/><path d="M22 19H2"/></svg><span>Debrief</span></button>
    <button type="button" data-tab="clips" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg><span>Clips</span></button>
    <button type="button" data-tab="maps" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg><span>Maps</span></button>
  </div>
</nav>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="pack-apex.js"></script>
<script>
(function(){
"use strict";
var P = window.PACK;
var view = document.getElementById("view");
if(!P){ view.textContent = "The content pack didn't load. Check that pack-apex.js was uploaded next to index.html."; return; }
document.title = "Clip Review";

// ===================== storage =====================
var PFX = P.storagePrefix;
var K = { profile:PFX+"_profile_v1", manual:PFX+"_manual_v1", debrief:PFX+"_debrief_v1", clips:PFX+"_clip_review_v1", draft:PFX+"_clip_draft",
          clipTimer:PFX+"_clip_session", backup:PFX+"_last_backup", ui:PFX+"_ui_v1" };
function lget(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lset(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// ===================== helpers =====================
function h(tag, attrs){ var el=document.createElement(tag); if(attrs) for(var k in attrs){ var v=attrs[k]; if(v==null||v===false) continue; if(k==="text") el.textContent=v; else if(k==="html") el.innerHTML=v; else if(k==="class") el.className=v; else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v); else el.setAttribute(k, v===true?"":v); }
  for(var i=2;i<arguments.length;i++){ var ch=arguments[i]; if(ch==null) continue; if(Array.isArray(ch)) ch.forEach(function(x){ if(x!=null) el.appendChild(typeof x==="string"?document.createTextNode(x):x); }); else el.appendChild(typeof ch==="string"?document.createTextNode(ch):ch); }
  return el; }
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function pad(n){ return (n<10?"0":"")+n; }
function ymd(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return ymd(new Date()); }
function addDays(s,n){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return ymd(d); }
function pretty(s){ var p=s.split("-"); var d=new Date(+p[0],+p[1]-1,+p[2]); return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){ if(!iso) return ""; var p=iso.slice(0,10).split("-"); return MON[+p[1]-1]+" "+(+p[2]); }
function label(list,k){ for(var i=0;i<list.length;i++) if(list[i][0]===k) return list[i][1]; return ""; }
function labels(list,arr){ return (arr||[]).map(function(k){ return label(list,k); }).filter(Boolean).join(", "); }
var toastT; function toast(m){ var el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){ el.classList.remove("show"); },2200); }
function typing(){ var a=document.activeElement; return !!(a && (a.tagName==="TEXTAREA"||a.tagName==="INPUT") && view.contains(a)); }
function setPressed(group, val){ var bs=group.querySelectorAll("button[data-k]"); for(var i=0;i<bs.length;i++){ var k=bs[i].getAttribute("data-k"); bs[i].setAttribute("aria-pressed", String(Array.isArray(val)? val.indexOf(k)>=0 : k===val)); } }

// ===================== errors =====================
function showErr(msg){
  var el=document.getElementById("err"); clear(el);
  el.appendChild(h("p",null,"Something on this page broke. Tap Reset screen to keep going; your data is saved. If it keeps happening, screenshot this box for Claude."));
  el.appendChild(h("p",null,h("code",{text:String(msg||"Unknown error").slice(0,300)})));
  el.appendChild(h("button",{type:"button",class:"ghost",onclick:function(){ el.hidden=true; safeRender(); }},"Reset screen"));
  el.hidden=false;
}
window.addEventListener("error",function(e){ showErr(e && (e.message || (e.error&&e.error.message))); });
window.addEventListener("unhandledrejection",function(e){ var r=e&&e.reason; showErr(r&&(r.message||r.code)||r); });

// ===================== content =====================
var MODS = P.modules;
var CARDS = P.cards, byId = {}; CARDS.forEach(function(c){ byId[c.id]=c; });
var INTERVAL = {1:1,2:3,3:7,4:14,5:30};
var FOCI = {}, FOCUS_ORDER = [];
P.habits.forEach(function(hb){ FOCI[hb.id]={name:hb.name, what:hb.what, mod:hb.mod, note:"Cards "+hb.cards.join(", "), cards:hb.cards}; FOCUS_ORDER.push(hb.id); });
Object.keys(P.extraFoci||{}).forEach(function(k){ var x=P.extraFoci[k]; FOCI[k]={name:x.name, what:x.what, mod:null, note:x.what, cards:[]}; FOCUS_ORDER.push(k); });
function isHabit(k){ return /^\d+$/.test(String(k)); }
function focusName(k){ k=k==null?null:String(k); return k&&FOCI[k]?((isHabit(k)?"#"+k+" ":"")+FOCI[k].name):""; }
var CL = P.clips;
var GROUP_ORDER = ["drop","position","comms","fight","kit"];
var ALLCHECKS = []; GROUP_ORDER.forEach(function(g){ if(CL.groups[g]) CL.groups[g].checks.forEach(function(c){ c.group=CL.groups[g].title; ALLCHECKS.push(c); }); });
function causeOf(k){ for(var i=0;i<CL.causes.length;i++) if(CL.causes[i].k===k) return CL.causes[i]; return null; }
var STEPS = ["Clip","Gut pass","Rewind","Before the fight","Comms","The fight","Verdict"], LAST = STEPS.length-1;

// ===================== key-point grader =====================
// Each card lists key points; each point has accepted phrasings. A phrasing hits when every word stem in it
// appears in the answer (prefix match, with a one-letter typo allowed on longer stems).
function gnorm(s){ return String(s||"").toLowerCase().replace(/[’'`]/g,"").replace(/-/g,"").replace(/[^a-z0-9]+/g," ").trim(); }
function lev1(a,b){ if(a===b) return true; var la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  var i=0,j=0,ed=0; while(i<la&&j<lb){ if(a[i]===b[j]){i++;j++;continue;} if(++ed>1) return false; if(la>lb) i++; else if(lb>la) j++; else {i++;j++;} }
  return ed+(la-i)+(lb-j)<=1; }
function stemHit(stem, toks){ for(var i=0;i<toks.length;i++){ var t=toks[i];
    if(t.indexOf(stem)===0) return true;
    if(stem.length>=5 && t.indexOf(stem)>=0) return true;
    if(stem.length>=5 && t.length>=stem.length-1 && lev1(t.slice(0,stem.length),stem)) return true;
    if(stem.length>=5 && lev1(t,stem)) return true; } return false; }
function altHit(alt, toks){ var st=gnorm(alt).split(" ").filter(Boolean); return st.length>0 && st.every(function(x){ return stemHit(x,toks); }); }
function gradeAnswer(answer, kps){
  var toks=gnorm(answer).split(" ").filter(Boolean), total=kps.length;
  if(toks.length<2) return {hits:kps.map(function(){ return false; }), n:0, total:total, grade:"miss"};
  var hits=kps.map(function(kp){ return kp[1].some(function(a){ return altHit(a,toks); }); }), n=hits.filter(Boolean).length;
  var gotAt=Math.max(total-1, Math.ceil(total*0.75)), shakyAt=Math.ceil(total/2);
  return {hits:hits, n:n, total:total, grade:n>=gotAt?"got":n>=shakyAt?"shaky":"miss"};
}
var GRADE_NAME={got:"Got it",shaky:"Shaky",miss:"Missed"};
function depthHits(answer, dp){ var toks=gnorm(answer).split(" ").filter(Boolean); return (dp||[]).map(function(kp){ return kp[1].some(function(a){ return altHit(a,toks); }); }); }

// ===================== state =====================
function blankDraft(){ return {type:null,map:"",legend:"",label:"",situation:[],starter:null,plan:null,gut:"",when:null,lastGood:"",checks:{},cause:null,kind:null,habit:null,fix:"",rehearsed:false,question:""}; }
function normDraft(d){ var b=blankDraft(); d=d||{}; for(var k in b) if(d[k]===undefined) d[k]=b[k]; if(!Array.isArray(d.situation)) d.situation=[]; if(!d.checks||typeof d.checks!=="object") d.checks={}; return d; }
var S = {
  profile: Object.assign({setup:false, rank:"", mains:[], newPerDay:3, focus:P.habits[0].id}, lget(K.profile)||{}),
  reviews: ((lget(K.manual)||{}).reviews)||{},
  recall: ((lget(K.manual)||{}).recall)||[],
  snap: ((lget(K.manual)||{}).snap)||{},
  proof:false,
  sessions: ((lget(K.debrief)||{}).sessions)||[],
  clips: ((lget(K.clips)||{}).clips)||[],
  draft: normDraft(lget(K.draft)), step:-1,
  live: lget(PFX+"_live_v1"),
  ui: Object.assign({tab:"manual", manualSub:"today", clipSub:"review", map:0, libMod:"all"}, lget(K.ui)||{}),
  settings:false, mSession:null, open:{}, delArm:null, ans:{}, clipTimer:lget(K.clipTimer), dform:{exec:null,causes:[],focus:null}
};
if(typeof S.draft._step==="number" && S.draft._step>=0) S.step=Math.min(S.draft._step,LAST);
function saveProfile(){ lset(K.profile,S.profile); }
function saveManual(){ lset(K.manual,{reviews:S.reviews, recall:S.recall, snap:S.snap}); }
function saveDebrief(){ lset(K.debrief,{sessions:S.sessions}); }
function saveClips(){ lset(K.clips,{clips:S.clips}); }
function saveDraft(){ S.draft._step=S.step; S.draft._updated=Date.now(); lset(K.draft,S.draft); }
function saveUI(){ lset(K.ui,S.ui); }
function saveLive(){ lset(PFX+"_live_v1",S.live); }

// ===================== shared UI bits =====================
function subTabs(items, cur, onPick){
  var g=h("div",{class:"subtabs",role:"tablist",style:"grid-template-columns:repeat("+items.length+",1fr)"});
  items.forEach(function(it){ g.appendChild(h("button",{type:"button",role:"tab","aria-selected":String(cur===it[0]),onclick:function(){ onPick(it[0]); }}, it[1], it[2]?h("span",{class:"badge",text:String(it[2])}):null)); });
  return g;
}
function bars(panel, rows){
  var max=0; rows.forEach(function(r){ if(r.n>max) max=r.n; });
  rows.forEach(function(r){ panel.appendChild(h("div",{class:"bar"}, h("span",{class:"lbl",text:r.label}), h("span",{class:"track"}, h("span",{class:"fill",style:"width:"+(max?Math.round(r.n/max*100):0)+"%;background:"+(r.color||"var(--amber)")})), h("span",{class:"ct",text:String(r.n)}))); });
}
function goTab(tab){ S.settings=false; S.proof=false; S.ui.tab=tab; saveUI(); safeRender(); window.scrollTo(0,0); }

// ===================== SETUP (first run) =====================
function renderSetup(v){
  var p=S.profile, sel={rank:p.rank||"", mains:(p.mains||[]).slice(), npd:p.newPerDay||3};
  v.appendChild(h("section",{class:"panel"},
    h("h2",{text:"Welcome to Clip Review"}),
    h("p",{class:"sub",text:"A learning loop for "+P.game+", built on the Learning How to Learn method: short recall sessions spaced over days, one focus per game session, and honest review of your own clips."}),
    h("ol",{class:"steps-list"},
      h("li",null,h("span",null,h("b",null,"Manual. "),"A few cards a day. Type your answer, and the app grades it.")),
      h("li",null,h("span",null,h("b",null,"Debrief. "),"Play ranked with one focus, then log whether you ran it.")),
      h("li",null,h("span",null,h("b",null,"Clips. "),"Review a few clips the day after, one pass at a time.")),
      h("li",null,h("span",null,h("b",null,"Maps. "),"Read each map's structure before you drop.")))));
  var rankSel=h("select",{class:"inp",id:"setup-rank"}, h("option",{value:"",text:"Pick your rank"}), P.ranks.map(function(r){ var o=h("option",{value:r,text:r}); if(r===sel.rank) o.selected=true; return o; }));
  rankSel.addEventListener("change",function(){ sel.rank=rankSel.value; check(); });
  var mainsG=h("div",{class:"seg small"});
  P.legends.forEach(function(L){ mainsG.appendChild(h("button",{type:"button","data-k":L,"aria-pressed":String(sel.mains.indexOf(L)>=0),onclick:function(){ var i=sel.mains.indexOf(L); if(i>=0) sel.mains.splice(i,1); else sel.mains.push(L); setPressed(mainsG, sel.mains); check(); }}, L)); });
  var npdG=h("div",{class:"seg"});
  [1,2,3].forEach(function(n){ npdG.appendChild(h("button",{type:"button","data-k":String(n),"aria-pressed":String(sel.npd===n),onclick:function(){ sel.npd=n; setPressed(npdG,String(n)); }}, String(n))); });
  var go=h("button",{type:"button",class:"primary",disabled:true,onclick:function(){
    S.profile.rank=sel.rank; S.profile.mains=sel.mains; S.profile.newPerDay=sel.npd; S.profile.setup=true; saveProfile(); S.ui.tab="manual"; saveUI(); safeRender(); window.scrollTo(0,0); toast("You're set. Start with today's cards.");
  }},"Start");
  function check(){ go.disabled=!(sel.rank && sel.mains.length); }
  check();
  v.appendChild(h("section",{class:"panel"},
    h("h3",{text:"About you"}),
    h("div",{class:"field"}, h("label",{class:"q",for:"setup-rank"},"Your rank"), rankSel),
    h("div",{class:"field"}, h("div",{class:"q"},"Legends you play",h("span",{class:"note",text:"Pick your mains. They get kit tips in clip reviews and show first on maps."})), mainsG),
    h("div",{class:"field"}, h("div",{class:"q"},"New cards per day",h("span",{class:"note",text:"3 is plenty. Fewer if you only have a few minutes."})), npdG),
    go,
    h("p",{class:"faint",style:"margin:14px 0 0",text:"Moving from another phone, or have a backup file?"}),
    h("button",{type:"button",class:"ghost",style:"width:100%",onclick:pickRestore},"Restore from a backup file")));
}

// ===================== MANUAL =====================
function schedule(rev, grade, t){
  var box = rev ? rev.box : 0;
  if(grade==="learn") box=1; else if(grade==="got") box=Math.min(box+1,5); else if(grade==="shaky") box=Math.max(box,1); else box=1;
  var gap = grade==="got" ? INTERVAL[box] : 1;
  return { box:box, due:addDays(t,gap), last:t, learned:(rev&&rev.learned)||t, n:((rev&&rev.n)||0)+1 };
}
function stage(rev){ if(!rev) return "new"; if(rev.box>=5) return "own"; if(rev.box>=3) return "solid"; return "learn"; }
function dueList(t){ return CARDS.filter(function(c){ var r=S.reviews[c.id]; return r && r.due<=t; }).sort(function(a,b){ return S.reviews[a.id].due.localeCompare(S.reviews[b.id].due) || a.mod-b.mod; }); }
function newQueue(){ var seen={}, q=[]; (P.newOrder||[]).forEach(function(id){ if(byId[id] && !S.reviews[id] && !seen[id]){ seen[id]=1; q.push(byId[id]); } }); CARDS.forEach(function(c){ if(!S.reviews[c.id] && !seen[c.id]) q.push(c); }); return q; }
function learnedToday(t){ var n=0; for(var k in S.reviews){ if(S.reviews[k].learned===t && S.reviews[k].n===1) n++; } return n; }
function newAvailable(t){ return Math.max(0, Math.min((S.profile.newPerDay||3) - learnedToday(t), newQueue().length)); }
function nextDue(t){ var best=null; for(var k in S.reviews){ var d=S.reviews[k].due; if(d>t && (!best||d<best)) best=d; } return best; }
function interleave(list){ var b={}; list.forEach(function(c){ (b[c.mod]=b[c.mod]||[]).push(c); }); var keys=Object.keys(b), out=[], more=true; while(more){ more=false; keys.forEach(function(k){ if(b[k].length){ out.push(b[k].shift()); more=true; } }); } return out; }
function inDays(n){ return n===1?"tomorrow":"in "+n+" days"; }

function wrapText(ctx, text, x, y, maxW, lh, maxLines){
  var words=String(text).split(" "), line="", lines=0;
  for(var i=0;i<words.length;i++){ var test=line?line+" "+words[i]:words[i];
    if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,y); y+=lh; line=words[i]; if(++lines>=maxLines-1){ var rest=words.slice(i).join(" "); while(ctx.measureText(rest+"…").width>maxW && rest.length) rest=rest.slice(0,-1); ctx.fillText(rest+(rest.length<words.slice(i).join(" ").length?"…":""),x,y); return y+lh; } }
    else line=test; }
  if(line){ ctx.fillText(line,x,y); y+=lh; } return y;
}

function restoreFrom(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result); if(!o || (o.pack && o.pack!==P.id)) throw new Error("pack");
      var added={clips:0,sessions:0,cards:0}, gotDraft=false;
      (o.clips||[]).forEach(function(c){ if(c&&c.id&&!S.clips.some(function(x){ return x.id===c.id; })){ S.clips.push(c); added.clips++; } });
      (o.sessions||[]).forEach(function(s){ if(s&&s.id&&!S.sessions.some(function(x){ return x.id===s.id; })){ S.sessions.push(s); added.sessions++; } });
      var seen={}; S.recall.forEach(function(x){ seen[x.ts+"|"+x.id]=1; });
      ((o.manual&&o.manual.recall)||[]).forEach(function(x){ if(x&&!seen[x.ts+"|"+x.id]){ S.recall.push(x); seen[x.ts+"|"+x.id]=1; } });
      S.recall.sort(function(a,b){ return a.ts-b.ts; });
      var sn=(o.manual&&o.manual.snap)||{}; Object.keys(sn).forEach(function(d){ if(!S.snap[d]) S.snap[d]=sn[d]; });
      var rv=(o.manual&&o.manual.reviews)||{}; Object.keys(rv).forEach(function(id){ var mine=S.reviews[id], theirs=rv[id]; if(theirs && (!mine || (theirs.last||"")>(mine.last||""))){ S.reviews[id]=theirs; added.cards++; } });
      if(o.draft && o.draft.type && !S.draft.type){ S.draft=normDraft(o.draft); S.step=(typeof o.draft._step==="number"&&o.draft._step>=0)?Math.min(o.draft._step,LAST):-1; lset(K.draft,S.draft); gotDraft=true; }
      if(o.live && !S.live){ S.live=o.live; saveLive(); }
      if(o.profile && o.profile.setup && !S.profile.setup){ S.profile=Object.assign(S.profile,o.profile); }
      saveClips(); saveDebrief(); saveManual(); saveProfile(); S.settings=false; safeRender(); window.scrollTo(0,0);
      var parts=[]; if(added.cards) parts.push(added.cards+" card"+(added.cards===1?"":"s")); if(added.sessions) parts.push(added.sessions+" session"+(added.sessions===1?"":"s")); if(added.clips) parts.push(added.clips+" clip review"+(added.clips===1?"":"s")); if(gotDraft) parts.push("your unfinished review");
      toast(parts.length?"Restored "+parts.join(", ")+".":"Nothing new in that file.");

  };
  r.readAsText(file);
}
